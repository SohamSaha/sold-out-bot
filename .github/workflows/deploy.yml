name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/sohamsaha/sold-out-bot:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Wait for Tailscale
        run: sleep 10

      - name: Debug Tailscale
        run: |
          sudo tailscale status
          sudo tailscale ip
          ping -c 3 ${{ secrets.PI_HOST }} || echo "Ping failed"

      - name: Deploy to Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/sohamsaha/sold-out-bot:latest
            docker stop sold-out-bot || true
            docker rm sold-out-bot || true
            docker run -d \
              --name sold-out-bot \
              --restart unless-stopped \
              --env-file /home/${{ secrets.PI_USER }}/.env \
              ghcr.io/sohamsaha/sold-out-bot:latest
